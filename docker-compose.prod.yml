name: combat-des-chefs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-combat}
      POSTGRES_USER: ${POSTGRES_USER:-combat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-combat} -d ${POSTGRES_DB:-combat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: combat-des-chefs-backend:latest
    pull_policy: build
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-combat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-combat}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: combat-des-chefs-app:latest
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${PORT_APP_PROD:-8091}:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file: .env.prod
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  pgdata:
