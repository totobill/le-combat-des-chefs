name: combat-des-chefs-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-combat}
      POSTGRES_USER: ${POSTGRES_USER:-combat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-combat}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-combat} -d ${POSTGRES_DB:-combat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-combat}:${POSTGRES_PASSWORD:-combat}@db:5432/${POSTGRES_DB:-combat}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-combat2026}
      SESSION_CODE: ${SESSION_CODE:-CHEFS}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --reload --reload-delay 2 --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: ${POLL_MS:-2000}
    ports:
      - "${PORT_APP_DEV:-4200}:4200"
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
      npm run ng -- serve
      --configuration development
      --host 0.0.0.0
      --port 4200
      --poll ${POLL_MS:-2000}
      --disable-host-check
      --proxy-config proxy.conf.docker.json"

volumes:
  pgdata_dev:
  frontend_node_modules:
