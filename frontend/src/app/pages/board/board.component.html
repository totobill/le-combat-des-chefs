<div class="board">
  <header>
    <div class="label">CLASSEMENT EN DIRECT</div>
    <h1 class="font-bebas title">ADWISE <span>SURVIVOR</span></h1>
    <div class="board-sub font-bebas">Le Combat des Chefs</div>
  </header>

  <div class="podium">
    @for (t of podiumOrder(); track $index) {
      @if (t) {
        <div class="podium-col" [class]="'p' + ($index === 1 ? 1 : $index === 0 ? 2 : 3)">
          <div class="pts font-bebas" [style.color]="t.color">{{ t.score_total }}</div>
          <div class="pname">{{ t.name }}</div>
          <div class="block font-bebas">{{ medal($index) }}</div>
        </div>
      }
    }
  </div>

  <table class="score-table card">
    <thead>
      <tr><th>#</th><th>Équipe</th><th>Score</th><th></th></tr>
    </thead>
    <tbody>
      @for (t of teams; track t.id; let i = $index) {
        <tr>
          <td class="font-bebas rank-cell">{{ i + 1 }}</td>
          <td><span class="dot" [style.background]="t.color"></span>{{ t.name }}</td>
          <td class="font-bebas score-cell" [style.color]="t.color">{{ t.score_total }}</td>
          <td class="bar-cell">
            <div class="bar-wrap">
              <div class="bar" [style.width.%]="(t.score_total / maxScore()) * 100" [style.background]="t.color"></div>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
