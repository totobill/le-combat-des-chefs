<div class="page-center home">
  <img class="home-logo-img" src="icons/icon-192.png" alt="Adwise Survivor" width="140" height="140" />
  <h1 class="font-bebas title">ADWISE <span>SURVIVOR</span></h1>
  <p class="tagline font-bebas">Le Combat des Chefs</p>

  <div class="primary-cards">
    <a routerLink="/host" class="nav-card primary">
      <div class="icon">🎙️</div>
      <div class="font-bebas card-title">Animateur</div>
      <div class="desc">Scores · Questions · Pilotage</div>
    </a>
    <a routerLink="/board" target="_blank" class="nav-card primary">
      <div class="icon">🏆</div>
      <div class="font-bebas card-title">Grand écran</div>
      <div class="desc">Classement &amp; questions en direct</div>
    </a>
  </div>

  <div class="secondary-cards">
    <a routerLink="/admin/login" class="nav-card small">
      <span>⚙️ Admin</span>
    </a>
    <a routerLink="/join" class="nav-card small">
      <span>📱 Équipes</span>
    </a>
  </div>

  @if (teams.length) {
    <div class="teams-preview card">
      <div class="font-bebas section-title">Classement actuel</div>
      <div class="team-row">
        @for (t of teams; track t.id) {
          <span class="team-pill" [style.borderColor]="t.color">
            <span class="dot" [style.background]="t.color"></span>
            {{ t.name }} · {{ t.score_total }} pts
          </span>
        }
      </div>
    </div>
  }
</div>
